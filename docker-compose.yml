# ========================================================
# DH STUDIO PRO - ADMIN DASHBOARD (Next.js static export + Nginx)
#
# Build & chạy:   docker compose up -d --build
# Đổi API:        NEXT_PUBLIC_API_URL=https://... docker compose build
# Lưu ý: NEXT_PUBLIC_API_URL được nhúng lúc BUILD, đổi URL phải build lại image.
# ========================================================
name: dh-studio-admin

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://apidhstudio.devhouse.vn}
    image: ${ADMIN_IMAGE:-dh-studio-admin}:${ADMIN_TAG:-latest}
    container_name: dh-studio-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
